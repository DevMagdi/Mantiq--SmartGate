# ============================================================================
# GateVision — production stack (real cameras, real ML, real barriers)
#
#   cp .env.example .env        # then set CV_MODE=real + your RTSP URLs
#   docker compose up --build -d
#
#   dashboard  -> http://localhost:8080
#   API docs   -> http://localhost:8000/docs
#
# For the scripted offline demo run:  CV_MODE=mock SEED_DEMO_DATA=true docker compose up
# See docs/real-deployment.md for the full go-live checklist.
# ============================================================================

name: gatevision

x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-text}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Cairo}
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-before-production}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gatevision}:${POSTGRES_PASSWORD:-gatevision}@postgres:5432/${POSTGRES_DB:-gatevision}
  AUTO_CREATE_TABLES: "false"
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  REDIS_ENABLED: "true"
  REDIS_URL: redis://redis:6379/0
  REDIS_EVENT_CHANNEL: ${REDIS_EVENT_CHANNEL:-gatevision:events}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["*"]}
  MEDIA_ROOT: /data/media
  MEDIA_URL: /media
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  # Real deployments start empty (admin account only); the demo compound is opt-in.
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gatevision.app}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-GateVision Administrator}
  CV_ENABLED: ${CV_ENABLED:-true}
  CV_RUNNER_ENABLED: "false"
  CV_MODE: ${CV_MODE:-real}
  CV_PLATE_DETECTOR: ${CV_PLATE_DETECTOR:-yolo}
  CV_PLATE_MODEL_PATH: /app/models/plate_yolov8.pt
  CV_OCR_ENGINE: ${CV_OCR_ENGINE:-easyocr}
  CV_OCR_LANGUAGES: ${CV_OCR_LANGUAGES:-["en"]}
  CV_FACE_ENGINE: ${CV_FACE_ENGINE:-insightface}
  CV_FACE_MODEL_NAME: ${CV_FACE_MODEL_NAME:-buffalo_l}
  CV_FACE_SIMILARITY_THRESHOLD: ${CV_FACE_SIMILARITY_THRESHOLD:-0.45}
  CV_DEMO_CAMERAS: ${CV_DEMO_CAMERAS:-false}
  CV_DEMO_INTERVAL_SECONDS: ${CV_DEMO_INTERVAL_SECONDS:-9}
  CV_ALLOW_DEMO_SOURCES: ${CV_ALLOW_DEMO_SOURCES:-false}
  CV_RTSP_TRANSPORT: ${CV_RTSP_TRANSPORT:-tcp}
  CV_RTSP_OPEN_TIMEOUT_MS: ${CV_RTSP_OPEN_TIMEOUT_MS:-5000}
  CV_RTSP_READ_TIMEOUT_MS: ${CV_RTSP_READ_TIMEOUT_MS:-5000}
  CV_RECONNECT_DELAY_SECONDS: ${CV_RECONNECT_DELAY_SECONDS:-2}
  CV_RECONNECT_MAX_DELAY_SECONDS: ${CV_RECONNECT_MAX_DELAY_SECONDS:-30}
  CV_STALL_TIMEOUT_SECONDS: ${CV_STALL_TIMEOUT_SECONDS:-20}
  CV_LOW_LIGHT_ENHANCE: ${CV_LOW_LIGHT_ENHANCE:-true}
  CV_LOW_LIGHT_THRESHOLD: ${CV_LOW_LIGHT_THRESHOLD:-70}
  CV_CAMERA_PROBE_FRAMES: ${CV_CAMERA_PROBE_FRAMES:-5}
  CV_MAX_FPS: ${CV_MAX_FPS:-5}
  CV_DEDUPE_SECONDS: ${CV_DEDUPE_SECONDS:-8}
  CV_SNAPSHOT_QUALITY: ${CV_SNAPSHOT_QUALITY:-85}
  CV_OCR_ALLOWLIST: ${CV_OCR_ALLOWLIST:-true}
  # Cameras can be bootstrapped from the environment (JSON, see docs).
  CAMERAS_JSON: ${CAMERAS_JSON:-}
  # Barrier defaults; a per-compound policy in the dashboard always wins.
  BARRIER_DRIVER: ${BARRIER_DRIVER:-simulator}
  BARRIER_WEBHOOK_URL: ${BARRIER_WEBHOOK_URL:-}
  BARRIER_WEBHOOK_SECRET: ${BARRIER_WEBHOOK_SECRET:-}
  BARRIER_WEBHOOK_TIMEOUT_SECONDS: ${BARRIER_WEBHOOK_TIMEOUT_SECONDS:-3}
  EXPORT_ROW_LIMIT: ${EXPORT_ROW_LIMIT:-50000}
  RETENTION_DAYS: ${RETENTION_DAYS:-365}
  MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
  MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-900}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatevision}
      POSTGRES_DB: ${POSTGRES_DB:-gatevision}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatevision} -d ${POSTGRES_DB:-gatevision}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        INSTALL_CV: "false"
    image: gatevision-api:latest
    restart: unless-stopped
    environment: *api-environment
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    volumes:
      - media_data:/data/media
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  cv-worker:
    build:
      context: ./backend
      args:
        INSTALL_CV: "true"
    image: gatevision-cv:latest
    restart: unless-stopped
    environment:
      <<: *api-environment
      CV_RUNNER_ENABLED: "true"
      CV_PLATE_DETECTOR: ${CV_PLATE_DETECTOR:-yolo}
      CV_OCR_ENGINE: ${CV_OCR_ENGINE:-easyocr}
      CV_FACE_ENGINE: ${CV_FACE_ENGINE:-insightface}
    command: ["python", "-m", "app.cv.runner"]
    volumes:
      - media_data:/data/media
      - ${CV_MODELS_DIR:-./backend/models}:/app/models:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The runner writes a heartbeat file; a hung worker shows up as unhealthy.
      test:
        - CMD
        - python
        - -c
        - |
          import pathlib, sys, time
          p = pathlib.Path("/tmp/gatevision-cv.heartbeat")
          sys.exit(0 if p.exists() and time.time() - float(p.read_text() or 0) < 120 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_MEDIA_BASE_URL: ${VITE_MEDIA_BASE_URL:-}
    image: gatevision-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  media_data:
